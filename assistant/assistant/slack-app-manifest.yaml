display_information:
  name: "@NAME@"
  description: "The @PROJECT@ project assistant for managers and the team"
  background_color: "#1d1c1d"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: "@NAME@"
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history
      - channels:read
      - groups:read
      - chat:write
      - reactions:write
      - files:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
