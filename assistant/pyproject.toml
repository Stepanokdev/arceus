[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arceus-assistant"
version = "0.1.0"
description = "The project's assistant beside an Arceus factory: a web chat behind the console and a bot in Slack"
requires-python = ">=3.12"
dependencies = [
  "arceus-runner",
  "starlette>=1.10,<2",
  "uvicorn>=0.54,<0.55",
  "python-multipart>=0.0.33,<0.1",
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<0.29",
  "slack_sdk>=3.36,<4",
  "aiohttp>=3.14,<4",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
voice = ["faster-whisper>=1.1,<2"]

[project.scripts]
arceus-assistant = "assistant.server:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["static/*", "static/vendor/*", "prompt.md", "session-settings.json",
             "slack-app-manifest.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
